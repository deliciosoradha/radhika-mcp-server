[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radhika-mcp"
version = "1.1.0"
description = "RadhikaChain x402 & MPP MCP Server for Autonomous AI Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "x402", "ai-agents", "payments", "blockchain", "radhikachain", "langchain"]
authors = [{ name = "RadhikaChain Team" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Liquidación x402 real con el SDK oficial (x402.org)
settlement = [
    "x402[clients,evm]>=2.25.0",
]
# Integración LangChain
langchain = [
    "langchain>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
]
all = [
    "x402[clients,evm]>=2.25.0",
    "langchain>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
]

[project.urls]
Homepage = "https://radhikachain.xyz"
Repository = "https://github.com/deliciosoradha/radhika-mcp-server"
Gateway = "https://x402.radhikachain.xyz"
Catalog = "https://x402.radhikachain.xyz/.well-known/x402"

[project.scripts]
radhika-mcp = "radhika_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["radhika_mcp"]
